name: Build and publish plugin package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build goaladvent-dev.op
        run: zip -r goaladvent-dev.op info.toml README.md src

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "**goaladvent ${GITHUB_REF_NAME}**"
            echo
            if [ -n "$PREV" ]; then
              git log --pretty=format:'- %s' "${PREV}..${GITHUB_REF_NAME}"
              echo
              echo
              echo "Full Changelog: ${PREV}...${GITHUB_REF_NAME}"
            else
              git log --pretty=format:'- %s' "${GITHUB_REF_NAME}"
            fi
          } > release_notes.md
          gh release create "${GITHUB_REF_NAME}" goaladvent-dev.op \
            --repo "${GITHUB_REPOSITORY}" \
            --title "goaladvent ${GITHUB_REF_NAME}" \
            --notes-file release_notes.md
