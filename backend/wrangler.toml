# Cloudflare Worker configuration for the Goalmas backend.
# Replace database_id with the value printed by: wrangler d1 create goalmas

name = "goalmas"
main = "worker.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "goalmas"
database_id = "PASTE_D1_DATABASE_ID_HERE"
